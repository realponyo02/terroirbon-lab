<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>떼루아본 피부 자가진단</title>
    
    <style>
        :root {
            --bg-color: #FFFFFF;
            --card-bg: #FFFFFF;
            --point-color: #902533;
            --point-light: rgba(144, 37, 51, 0.08);
            --text-color: #222222;
            --light-text: #888888;
            --border-color: #E6E3DB;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        /* 전체 폰트 맑은 고딕 적용 */
        body, button, input, select, textarea {
            background-color: #E8E5DC;
            font-family: 'Malgun Gothic', '맑은 고딕', apple-system, sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 880px;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 480px) {
            #app-container {
                height: 92vh;
                border-radius: 20px;
            }
        }

        .serif { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; }

        .page {
            display: none;
            padding: 32px 24px;
            height: 100%;
            flex-direction: column;
            overflow-y: auto;
            animation: smoreFadeIn 0.35s ease-out;
        }
        .page.active { display: flex; }

        @keyframes smoreFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 공통 메인 버튼: 세로 늘어남 완전 차단 및 슬림 가로 직사각형 */
        .btn-primary {
            background-color: var(--point-color);
            color: #ffffff;
            border: none;
            height: 40px !important;
            min-height: 40px !important;
            max-height: 40px !important;
            flex: none !important;
            flex-grow: 0 !important;
            width: fit-content !important;
            padding: 0 28px !important;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            margin: 0 auto;
            transition: all 0.2s ease;
            box-shadow: 0 3px 10px rgba(144, 37, 51, 0.2);
        }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }

        /* 공통 서브 버튼: 세로 늘어남 완전 차단 및 슬림 가로 직사각형 */
        .btn-secondary {
            background-color: transparent;
            color: var(--point-color);
            border: 1px solid var(--point-color);
            height: 38px !important;
            min-height: 38px !important;
            max-height: 38px !important;
            flex: none !important;
            flex-grow: 0 !important;
            width: fit-content !important;
            padding: 0 24px !important;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            margin: 0 auto;
            transition: all 0.2s ease;
        }

        /* 메인 페이지 */
        #intro-page {
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 24px 24px 36px;
        }

        .intro-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* 로고: 메인 이미지 상단(이미지와 겹치지 않게 바깥에 배치) */
        .intro-logo {
            width: 120px;
            height: auto;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        /* 메인 이미지 컨테이너 (직각 테두리) */
        .intro-img-container {
            position: relative;
            width: 100%;
            border-radius: 0;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            margin-top: 20px;
        }

        .intro-main-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            border-radius: 0;
        }

        /* 메인 이미지 상단 오버레이 문구 */
        .intro-subject {
            position: absolute;
            top: 100px; /* 이미지 상단 부분에 겹쳐서 위치 */
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            padding: 0 16px;
            font-size: 20px;
            line-height: 1.5;
            color: var(--text-color);
            font-weight: 600;
            word-break: keep-all;
            margin-top: 0;
            z-index: 2;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.85);
        }

        /* 질문 페이지 */
        .quiz-header {
            width: 100%;
            margin-bottom: 28px;
        }

        .step-counter {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--point-color);
            margin-bottom: 8px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--point-color);
            width: 10%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .question-box {
            margin-bottom: 28px;
        }

        .question-text {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.45;
            color: var(--text-color);
            word-break: keep-all;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-card {
            background-color: var(--card-bg);
            border: 1.5px solid var(--border-color);
            padding: 12px 18px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            text-align: left;
        }

        .option-card:active, .option-card.selected {
            border-color: var(--point-color);
            background-color: var(--point-light);
            transform: translateY(-1px);
        }

        .option-badge {
            width: 26px;
            height: 26px;
            min-width: 26px;
            border-radius: 50%;
            background-color: #F4F2EC;
            color: var(--light-text);
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .option-card.selected .option-badge {
            background-color: var(--point-color);
            color: #ffffff;
        }

        .option-label {
            font-size: 15px;
            line-height: 1.4;
            color: var(--text-color);
            font-weight: 500;
            word-break: keep-all;
        }

        /* 결과 페이지 */
        #result-page {
            padding: 36px 24px;
        }

        .result-header {
            text-align: center;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .result-logo {
            width: 90px;
            height: auto;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .result-card {
            background: var(--card-bg);
            border-radius: 0px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            text-align: center;
            word-break: keep-all;
        }

        .result-card-subtitle {
            font-size: 17px;
            font-weight: 700;
            color: var(--point-color);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            word-break: keep-all;
        }

        .result-card-desc {
            font-size: 14px;
            line-height: 1.6;
            color: #444444;
            word-break: keep-all;
        }

        .recommend-card {
            background: linear-gradient(135deg, #902533 0%, #6B1D23 100%);
            color: #ffffff;
            border-radius: 16px;
            padding: 22px 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(144, 37, 51, 0.25);
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .recommend-badge {
            font-size: 12px;
            opacity: 0.9;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .recommend-card .result-title {
            font-size: 21px;
            color: #FFFFFF;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .recommend-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.45;
            word-break: keep-all;
        }

        .recommend-img {
            width: 100%;
            max-width: 240px;
            height: auto;
            border-radius: 16px;
            margin-top: 16px;
            object-fit: cover;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        }

        .action-group {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            flex: none !important;
        }
    </style>
</head>
<body>

<div id="app-container">
    
    <!-- 1페이지: 메인 -->
    <div id="intro-page" class="page active">
        <div class="intro-top">
            <!-- 1. 이미지와 겹치지 않게 위에 배치된 로고 -->
            <img src="terroirbon-identity_gray.png" alt="terroirbon logo" class="intro-logo">
            
            <!-- 2. 메인 이미지 + 상단 오버레이 문구 -->
            <div class="intro-img-container">
                <img src="1page image.png" alt="메인 이미지" class="intro-main-img">
                <p class="intro-subject serif">1분 자가진단으로 알아보는<br>떼루아본 맞춤 포뮬라 솔루션</p>
            </div>
        </div>
        
        <button class="btn-primary" onclick="startQuiz()">시작하기</button>
    </div>

    <!-- 2~11페이지: 질문 -->
    <div id="question-page" class="page">
        <div class="quiz-header">
            <div class="step-counter">
                <span>진단 진행률</span>
                <span id="step-text">1 / 10</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </div>

        <div class="question-box">
            <h2 class="question-text" id="q-title">질문 타이틀</h2>
        </div>
        
        <div class="options-container" id="options"></div>
    </div>

    <!-- 결과 페이지 -->
    <div id="result-page" class="page">
        <div class="result-header">
            <img src="terroirbon-identity_gray.png" alt="terroirbon logo" class="result-logo">
        </div>

        <div class="result-card">
            <div class="result-card-subtitle" id="result-subtitle">겉촉속바! 수부지형 피부</div>
            <div class="result-card-desc" id="result-desc">
                진단 결과 설명
            </div>
        </div>
        
        <div class="recommend-card">
            <p class="recommend-badge">떼루아본 LAB의 솔루션</p>
            <h1 class="result-title serif" id="result-type">Fresh Grape</h1>
            <p class="recommend-title serif" id="result-product">
                추천 포뮬라
            </p>
            <img id="result-product-img" src="" alt="추천 제품 이미지" class="recommend-img">
        </div>
        
        <div class="action-group">
            <button class="btn-primary" onclick="copyResultLink()">진단 인증 후 상품 받기</button>
            <button class="btn-secondary" onclick="location.reload()">다시 진단하기</button>
        </div>
    </div>

</div>

<script>
    const questions = [
        {
            title: "Q1. 세안 후 피부가 당긴다.",
            options: [
                { text: "그렇다", type: "A", weight: 1 },
                { text: "아니다", type: "NONE", weight: 0 }
            ]
        },
        {
            title: "Q2. 낮부터 피부 겉에 유분이 올라온다.",
            options: [
                { text: "그렇다", type: "A", weight: 1 },
                { text: "아니다", type: "NONE", weight: 0 }
            ]
        },
        {
            title: "Q3. 작은 온도 변화에도 피부가 쉽게 붉어진다.",
            options: [
                { text: "그렇다", type: "B", weight: 1 },
                { text: "아니다", type: "NONE", weight: 0 }
            ]
        },
        {
            title: "Q4. 컨디션이 조금만 안 좋아도 트러블이 올라온다.",
            options: [
                { text: "그렇다", type: "B", weight: 1 },
                { text: "아니다", type: "NONE", weight: 0 }
            ]
        },
        {
            title: "Q5. 나는 순한 제품이 아니면 화장품을 못 쓴다.",
            options: [
                { text: "그렇다", type: "B", weight: 1 },
                { text: "아니다", type: "NONE", weight: 0 }
            ]
        },
        {
            title: "Q6. 내 피부가 자주 칙칙해 보인다.",
            options: [
                { text: "그렇다", type: "D", weight: 1 },
                { text: "아니다", type: "NONE", weight: 0 }
            ]
        },
        {
            title: "Q7. 내 피부는 윤기가 없어 보인다.",
            options: [
                { text: "그렇다", type: "D", weight: 1 },
                { text: "아니다", type: "NONE", weight: 0 }
            ]
        },
        {
            title: "Q8. 베개 자국이 전보다 느리게 지워지는 느낌이다.",
            options: [
                { text: "그렇다", type: "C", weight: 1 },
                { text: "아니다", type: "NONE", weight: 0 }
            ]
        },
        {
            title: "Q9. 피부 탄력의 텐션이 떨어진 게 눈에 띈다.",
            options: [
                { text: "그렇다", type: "C", weight: 1 },
                { text: "아니다", type: "NONE", weight: 0 }
            ]
        },
        {
            title: "Q10. 지금 내 피부에 가장 원하는 변화는?",
            options: [
                { text: "즉각적인 수분 충전", type: "A", weight: 2 },
                { text: "순한 진정 케어", type: "B", weight: 2 },
                { text: "피부 속 탄력 케어", type: "C", weight: 2 },
                { text: "자연스러운 광채 케어", type: "D", weight: 2 }
            ]
        }
    ];

    const results = {
        "A": {
            type: "Fresh Grape",
            subtitle: "겉촉속바! 수부지형 피부",
            desc: "피부 겉은 오일리해 보일 수 있으나<br>속은 수분이 바짝 말라있는 상태에요.<br>즉각적인 수분 공급을 통해<br>피부 속 수분케어가 필요합니다.",
            product: "가볍고 산뜻한 마무리감을 가진<br><strong>그레이프셀 버블 에센스 토너</strong>를 처방해드립니다.",
            img: "T_y.png"
        },
        "B": {
            type: "Deep Grape",
            subtitle: "여린 민감성 피부",
            desc: "외부 자극과 스트레스로 인해<br>피부가 민감해진 상태에요.<br>피부 컨디션을 안정시키는 순한케어가 필요합니다.",
            product: "순하고 빠르게 건강한 피부로 회복시켜주는<br><strong>그레이프셀 탱탱 텐션 토탈 마스크팩</strong>을 처방해드립니다.",
            img: "M_y.png"
        },
        "C": {
            type: "Rich Grape",
            subtitle: "탄력 부족형 피부",
            desc: "피부의 탄력이 떨어지기 시작한 상태에요.<br>밀도 높은 퍼밍 탄력 케어로<br>리프팅이 필요합니다.",
            product: "급속도 올인원 케어 전문<br><strong>그레이프셀 퍼밍 앰플</strong>을 처방해드립니다.",
            img: "A_y.jpg"
        },
        "D": {
            type: "Juicy Grape",
            subtitle: "피부결이 거친 피부",
            desc: "피부 턴오버 주기가 둔화되어<br>칙칙하고 윤기가 부족한 상태에요.<br>맑고 자연스러운 광채를 부여하는<br>케어가 필요합니다.",
            product: "피부장벽을 보호하면서 광채감을 선사하는<br><strong>그레이프셀 핑크캡슐 크림</strong>을 처방해드립니다.",
            img: "C_y.jpg"
        }
    };

    let currentQuestionIndex = 0;
    let scores = { A: 0, B: 0, C: 0, D: 0 };
    let isSelecting = false;

    function startQuiz() {
        document.getElementById('intro-page').classList.remove('active');
        document.getElementById('question-page').classList.add('active');
        renderQuestion();
    }

    function renderQuestion() {
        isSelecting = false;
        const q = questions[currentQuestionIndex];
        
        document.getElementById('step-text').innerText = `${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('q-title').innerText = q.title;
        
        const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
        document.getElementById('progress-bar').style.width = progress + '%';

        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        const badges = ['A', 'B', 'C', 'D'];
        
        q.options.forEach((option, idx) => {
            const card = document.createElement('div');
            card.className = 'option-card';
            
            card.innerHTML = `
                <div class="option-badge">${badges[idx]}</div>
                <div class="option-label">${option.text}</div>
            `;
            
            card.onclick = () => selectOption(option.type, option.weight, card);
            optionsDiv.appendChild(card);
        });

        const page = document.getElementById('question-page');
        page.style.animation = 'none';
        page.offsetHeight;
        page.style.animation = 'smoreFadeIn 0.35s ease-out';
    }

    function selectOption(type, weight, cardElement) {
        if (isSelecting) return;
        isSelecting = true;

        cardElement.classList.add('selected');
        
        if (type !== "NONE") {
            scores[type] += weight;
        }

        setTimeout(() => {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResult();
            }
        }, 220);
    }

    function showResult() {
        let maxScore = -1;
        let finalType = 'A';
        
        for (const type in scores) {
            if (scores[type] > maxScore) {
                maxScore = scores[type];
                finalType = type;
            }
        }

        const resultData = results[finalType];

        document.getElementById('result-type').innerText = resultData.type;
        document.getElementById('result-subtitle').innerText = resultData.subtitle;
        document.getElementById('result-desc').innerHTML = resultData.desc;
        document.getElementById('result-product').innerHTML = resultData.product;
        document.getElementById('result-product-img').src = resultData.img;

        document.getElementById('question-page').classList.remove('active');
        document.getElementById('result-page').classList.add('active');
        
        window.scrollTo(0, 0);
    }

    function copyResultLink() {
        alert('떼루아본 연구원에게 결과를 보여주세요!');
    }
</script>
</body>
</html>
